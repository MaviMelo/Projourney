name: projourney
services:
  backend:
    build:
      context: /home/adm1/repositories_git/Projourney/backend_laravel
      dockerfile: Dockerfile
    command:
      - php
      - artisan
      - serve
      - --host=0.0.0.0
      - --port=8000
    container_name: projourney-backend
    depends_on:
      db:
        condition: service_started
        required: true
    environment:
      DB_DATABASE: projourney
      DB_HOST: db
      DB_PASSWORD: proj
      DB_PORT: "3306"
      DB_USERNAME: proj
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8000
        published: "8080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/adm1/repositories_git/Projourney/backend_laravel
        target: /var/www/html
        bind:
          create_host_path: true
      - type: volume
        target: /var/www/html/vendor
        volume: {}
    working_dir: /var/www/html
  db:
    container_name: projourney-db
    environment:
      MARIADB_DATABASE: projourney
      MARIADB_PASSWORD: proj
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: proj
    image: mariadb:11
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3306
        published: "3307"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: db_data
        target: /var/lib/mysql
        volume: {}
networks:
  default:
    name: projourney_default
volumes:
  db_data:
    name: projourney_db_data
