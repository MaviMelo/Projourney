services:
  # === PROXY NGINX ===
  nginx-proxy:
    image: nginx
    container_name: projourney-nginx-proxy
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - /home/bigg/Documentos/Projourney/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - projourney-network
    restart: unless-stopped

  # === FRONTEND REACT ===
  frontend:
    build:
      context: ./frontend_react
      dockerfile: Dockerfile
    container_name: projourney-frontend
    ports:
      - "3000:4173"  # Exposto também direto (opcional)
    environment:
      - VITE_API_URL=http://backend:8000
    networks:
      - projourney-network
    restart: unless-stopped

  # === BACKEND LARAVEL ===
  backend:
    build:
      context: ./backend_laravel
      dockerfile: Dockerfile
    container_name: projourney-backend
    ports:
      - "8000:9000"  # PHP-FPM
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:YOUR_APP_KEY_HERE
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=projourney
      - DB_USERNAME=projourney_user
      - DB_PASSWORD=secure_password
    depends_on:
      - mysql
    volumes:
      - ./backend_laravel/storage:/var/www/html/storage
      - ./backend_laravel/bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - projourney-network
    restart: unless-stopped

  # === BANCO DE DADOS MYSQL ===
  mysql:
    image: mysql:8.4
    container_name: projourney-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=projourney
      - MYSQL_USER=projourney_user
      - MYSQL_PASSWORD=secure_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - projourney-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  projourney-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
