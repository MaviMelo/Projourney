# Obs.: 
# * Os blocos 'enviroment:' contém credenciais genéricas apenas para desenvolvimento.
#   Quando em produção, todas as variaveis de ambiente devem ser importades de um 
#   arquivo '.env';
# * Roteamento de portas dos conteineres comentadas, descomentar e "re-build" para  
#   cesso externo apenas para debug enquanto em desenvolvimento.

services:
  db:
    image: mariadb:11
    container_name: projourney-db
    restart: unless-stopped
    # ports:
    #  - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root 
      MARIADB_DATABASE : projourney 
      MARIADB_USER : proj 
      MARIADB_PASSWORD : proj 
    volumes: 
      - db_data:/var/lib/mysql    # persistir dados do banco de dados em um volume

  backend:
    build:
      context: ./backend_laravel
      dockerfile: Dockerfile
    container_name: projourney-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend_laravel:/var/www/html  # bind mount do código para hot reload em dev 
      - /var/www/html/vendor    # não sobrescrever o vendor do container 
    # ports:
    #  - "8080:8000"  
    environment:
      DB_HOST: db 
      DB_PORT: 3306 
      DB_DATABASE: projourney 
      DB_USERNAME: proj 
      DB_PASSWORD: proj 
      APP_URL: http://localhost:8080           
      SANCTUM_STATEFUL_DOMAINS: localhost:8080
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build: 
      context: ./frontend_react
      dockerfile: Dockerfile
    container_name: projourney-frontend
    environment:
      VITE_API_URL: /api
    # ports:
    #  - "5174:80"
    depends_on:
      - backend

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: projourney-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes: 
  db_data: 
