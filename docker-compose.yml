services: 
  # === PROXY NGINX === 
  nginx-proxy: 
    image: nginx 
    container_name: projourney-nginx-proxy 
    ports: 
      - "8080:80" 
      - "443:443" 
    volumes: 
      - ./nginx.conf:/etc/nginx/nginx.conf:ro 
    depends_on: 
      - frontend 
      - backend 
    networks: 
      - projourney-network 
    restart: unless-stopped 

  # === FRONTEND REACT === 
  frontend: 
    build: 
      context: ./frontend_react 
      dockerfile: Dockerfile 
    container_name: projourney-frontend 
    ports: 
      - "3000:4173" 
    environment: 
      - VITE_API_URL=http://backend:8000 
    networks: 
      - projourney-network 
    restart: unless-stopped 

  # === BACKEND LARAVEL === 
  backend: 
    build: 
      context: ./backend_laravel 
      dockerfile: Dockerfile 
    container_name: projourney-backend 
    env_file: 
      - ./backend_laravel/.env 
    ports: 
      - "8000:9000" 
    environment: 
      - DB_HOST=mysql 
    depends_on: 
      - mysql 
    volumes: 
      - ./backend_laravel/storage:/var/www/html/storage 
      - ./backend_laravel/bootstrap/cache:/var/www/html/bootstrap/cache 
    networks: 
      - projourney-network 
    restart: unless-stopped 

  # === BANCO DE DADOS MYSQL === 
  mysql: 
    image: mysql:8.4 
    container_name: projourney-mysql 
    env_file: 
      - ./backend_laravel/.env 
    ports: 
      - "3307:3306" 
    volumes: 
      - mysql_data:/var/lib/mysql 
    networks: 
      - projourney-network 
    restart: unless-stopped 
    healthcheck: 
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 10s 
      timeout: 5s 
      retries: 5 

networks: 
  projourney-network: 
    driver: bridge 

volumes: 
  mysql_data: 
    driver: local
