services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/DockerfileLaravel
    container_name: laravel_backend_app
    volumes:
      - ./backend:/var/www:Z
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: ./docker/vite/DockerfileVite
    container_name: vite_frontend_app
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - app

  nginx:
    image: nginx:latest
    container_name: nginx_app
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www:Z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:Z
    depends_on:
      - backend
    networks:
      - app

  mysql:
    image: mysql:8.0
    container_name: mysql_app
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projourney_2 
    ports:
      - "3306:3306"
    networks:
      - app

networks:
  app:
