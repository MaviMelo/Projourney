events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # === UPSTREAMS ===
    upstream frontend_server {
        server frontend:4173; # Porta padrão do 'vite preview'
    }

    upstream backend_server {
        server backend:9000; # Porta nativa do PHP-FPM
    }

    # === SERVER BLOCK ===
    server {
        listen 80; # Escuta interna padrão do container Nginx
        server_name localhost;
        client_max_body_size 20M;

        # === FRONTEND (React / Vite Preview) ===
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # === BACKEND API (Laravel via FastCGI) ===
        location /api {
            include fastcgi_params;
            fastcgi_pass backend_server;
            
            # Aponta diretamente para o index.php público dentro do container do backend
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            
            # Ajustes de Buffer para APIs em PHP
            fastcgi_buffering off;
        }

        # === BACKEND API e SANCTUM (Laravel via FastCGI) ===
        location ~ ^/(api|sanctum|storage) {
            include fastcgi_params;
            fastcgi_pass backend_server;
            
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            
            fastcgi_buffering off;
        }

        # === HEALTH CHECK ===
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
